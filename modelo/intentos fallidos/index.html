<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teachable Machine Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        #webcam { border: 1px solid #ccc; }
        #label-container div { margin: 5px; }
    </style>
</head>
<body>
    <h1>Teachable Machine Model in HTML</h1>
    <video id="webcam" autoplay playsinline width="300" height="300"></video>
    <div id="label-container"></div>

    <div>
        <input type="file" id="selector-imagen" accept="image/*">
        <img id="vista-previa" alt="imagen subida">
        <div id="resultado-div"></div>
    </div>
    <script>
        // Change this to your model's URL or local path
        const MODEL_URL = "./model/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            try {
                // Load the model and metadata
                const modelURL = MODEL_URL + "model.json";
                const metadataURL = MODEL_URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // Setup webcam
                webcam = new tmImage.Webcam(300, 300, true); // width, height, flip
                await webcam.setup();
                await webcam.play();
                document.getElementById("webcam").appendChild(webcam.canvas);

                // Label container
                labelContainer = document.getElementById("label-container");
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }

                window.requestAnimationFrame(loop);
            } catch (err) {
                console.error("Error loading model or webcam:", err);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < prediction.length; i++) {
                const classPrediction = `${prediction[i].className}: ${prediction[i].probability.toFixed(2)}`;
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }

        init();
    </script>
</body>
</html>
